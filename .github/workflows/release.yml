name: PyPI release

# Note this workflow is designed to be locked-down to prevent supply chain attacks;
# 1. GitHub actions are specified by exact hash.
# 2. Distributions are built in a seperate job to the publishing action.
# 3. No caching is used to prevent cache poisoning.

on:
  release:
    types: [ published ]

jobs:
  package:
    runs-on: ubuntu-latest

    # Don't run in forks in the unlikely event a Release is created there.
    if: github.repository == 'Bogdanp/dramatiq'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --group build

      - name: Build dist packages
        run: python -m build .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "dist"
          path: "dist/"

  publish:
    runs-on: ubuntu-latest
    if: github.repository == 'Bogdanp/dramatiq'
    needs:
      - package
    environment: pypi # Specifying a GitHub environment is optional, but strongly encouraged
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: "dist"
          path: "dist"
      - name: Upload packages to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
