name: PyPI release

# Note this workflow is designed to be locked-down to prevent supply chain attacks;
# 1. GitHub actions are specified by exact hash.
# 2. Distributions are built in a seperate job to the publishing action.
# 3. No caching is used to prevent cache poisoning.

on:
  release:
    types: [ published ]

jobs:
  package:
    runs-on: ubuntu-latest

    # Don't run in forks in the unlikely event a Release is created there.
    if: github.repository == 'Bogdanp/dramatiq'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install --group build

      - name: Build dist packages
        run: python -m build .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "dist"
          path: "dist/"

  publish:
    runs-on: ubuntu-latest
    if: github.repository == 'Bogdanp/dramatiq'
    needs:
      - package
    environment: pypi # Specifying a GitHub environment is optional, but strongly encouraged
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: "dist"
          path: "dist"
      - name: Upload packages to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
